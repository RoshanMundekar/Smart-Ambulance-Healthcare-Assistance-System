version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: ambulance_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-smart_ambulance_db}
      MYSQL_USER: ${DB_USER:-ambulance_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-securepassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # FastAPI — serves both API (/api/*) and HTML pages (/, /dashboard, etc.)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ambulance_app
    restart: unless-stopped
    ports:
      - "80:8000"    # App accessible at http://localhost
      - "8000:8000"  # Also accessible at http://localhost:8000
    environment:
      - DATABASE_URL=mysql+pymysql://${DB_USER:-ambulance_user}:${DB_PASSWORD:-securepassword}@db:3306/${DB_NAME:-smart_ambulance_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-secret-key-in-production}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - DEBUG=False
      - WORKERS=4
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/app/ai/models:/app/app/ai/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
    driver: local

networks:
  default:
    name: ambulance_network
