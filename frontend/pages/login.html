<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login / Register — SmartAmbulance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/custom.css"/>
</head>
<body class="bg-gradient-to-br from-red-50 to-red-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="text-6xl mb-2">🚑</div>
      <h1 class="text-2xl font-bold text-red-600">SmartAmbulance</h1>
      <p class="text-gray-500 text-sm">Healthcare Assistance System</p>
    </div>

    <!-- Tabs -->
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
      <div class="flex">
        <button onclick="switchTab('login')" id="tab-login"
          class="flex-1 py-4 font-semibold text-red-600 border-b-2 border-red-600 transition">
          Login
        </button>
        <button onclick="switchTab('register')" id="tab-register"
          class="flex-1 py-4 font-semibold text-gray-400 border-b-2 border-transparent hover:text-red-600 transition">
          Register
        </button>
      </div>

      <!-- LOGIN FORM -->
      <div id="form-login" class="p-8">
        <h2 class="text-xl font-bold text-gray-800 mb-6">Welcome Back</h2>
        <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-600 rounded-lg p-3 mb-4 text-sm"></div>
        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" id="login-email" required placeholder="you@example.com"
              class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" id="login-password" required placeholder="••••••••"
              class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-500"/>
          </div>
          <button type="submit" id="login-btn"
            class="w-full bg-red-600 text-white font-bold py-3 rounded-xl hover:bg-red-700 transition flex items-center justify-center gap-2">
            <span id="login-spinner" class="hidden animate-spin">⏳</span>
            Login
          </button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-4">
          Demo: <strong>john@patient.com</strong> / <strong>password123</strong>
        </p>
      </div>

      <!-- REGISTER FORM -->
      <div id="form-register" class="p-8 hidden">
        <h2 class="text-xl font-bold text-gray-800 mb-6">Create Account</h2>
        <div id="register-error" class="hidden bg-red-50 border border-red-200 text-red-600 rounded-lg p-3 mb-4 text-sm"></div>
        <div id="register-success" class="hidden bg-green-50 border border-green-200 text-green-700 rounded-lg p-3 mb-4 text-sm"></div>
        <form onsubmit="handleRegister(event)" class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
              <input type="text" id="reg-name" required placeholder="John Doe"
                class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-500"/>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Age</label>
              <input type="number" id="reg-age" min="1" max="120" placeholder="25"
                class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-500"/>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
              <input type="tel" id="reg-phone" required placeholder="+91-9876543210"
                class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-500"/>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Blood Group</label>
              <select id="reg-blood" class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-500">
                <option value="">Select</option>
                <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" id="reg-email" required placeholder="you@example.com"
              class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" id="reg-password" required minlength="8" placeholder="Min 8 characters"
              class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-500"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Medical History (optional)</label>
            <textarea id="reg-history" rows="2" placeholder="Any existing conditions..."
              class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-500 resize-none"></textarea>
          </div>
          <button type="submit" id="reg-btn"
            class="w-full bg-red-600 text-white font-bold py-3 rounded-xl hover:bg-red-700 transition">
            Create Account
          </button>
        </form>
      </div>
    </div>

    <p class="text-center text-sm text-gray-400 mt-4">
      <a href="index.html" class="hover:text-red-600">← Back to Home</a>
    </p>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // Check if URL has #register fragment
    if (window.location.hash === '#register') switchTab('register');
  </script>
</body>
</html>
