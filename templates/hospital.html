<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hospital Dashboard — SmartAmbulance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/css/custom.css"/>
</head>
<body class="bg-slate-50 min-h-screen">

  <nav class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🏥</span>
        <div>
          <h1 class="font-bold text-slate-800 font-display leading-tight">Hospital Console</h1>
          <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider" id="hospital-name">Loading...</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 bg-emerald-50 border border-emerald-100/50 px-3 py-1.5 rounded-xl">
          <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
          <span class="text-[10px] font-bold uppercase tracking-wide text-emerald-700">Live feeds</span>
        </div>
        <button onclick="logout()" class="text-slate-500 hover:text-red-600 text-sm font-semibold hover:bg-red-50/50 px-3 py-1.5 rounded-xl transition-all">Logout</button>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-6 py-8">

    <!-- STATS ROW -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-5 mb-8">
      <div class="bg-white rounded-3xl border border-slate-100 p-6 shadow-sm text-center">
        <div class="text-3xl font-black font-display text-red-600" id="stat-emergencies">—</div>
        <div class="text-xs font-semibold text-slate-450 uppercase tracking-wider mt-2">Active Emergencies</div>
      </div>
      <div class="bg-white rounded-3xl border border-slate-100 p-6 shadow-sm text-center">
        <div class="text-3xl font-black font-display text-blue-600" id="stat-appointments">—</div>
        <div class="text-xs font-semibold text-slate-450 uppercase tracking-wider mt-2">Today's Appointments</div>
      </div>
      <div class="bg-white rounded-3xl border border-slate-100 p-6 shadow-sm text-center">
        <div class="text-3xl font-black font-display text-emerald-600" id="stat-doctors">—</div>
        <div class="text-xs font-semibold text-slate-450 uppercase tracking-wider mt-2">Doctors On Duty</div>
      </div>
      <div class="bg-white rounded-3xl border border-slate-100 p-6 shadow-sm text-center">
        <div class="text-3xl font-black font-display text-purple-600" id="stat-beds">—</div>
        <div class="text-xs font-semibold text-slate-450 uppercase tracking-wider mt-2">Available Beds</div>
      </div>
    </div>

    <div class="grid lg:grid-cols-3 gap-8">
      <!-- INCOMING EMERGENCIES -->
      <div class="lg:col-span-2">
        <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-6 md:p-8">
          <div class="flex justify-between items-center mb-6 pb-2 border-b border-slate-100">
            <h2 class="text-lg font-bold text-slate-800 font-display">🆘 Active Triage Queue</h2>
            <button onclick="loadDashboard()" class="text-red-600 text-sm font-semibold hover:underline flex items-center gap-1">🔄 Refresh</button>
          </div>
          <div id="emergencies-list" class="space-y-5">
            <div class="text-center text-slate-400 py-12">Loading emergencies...</div>
          </div>
        </div>
      </div>

      <!-- QUICK ACTIONS -->
      <div class="space-y-6">
        <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-6">
          <h3 class="font-bold text-slate-800 mb-4 font-display">Operations Desk</h3>
          <div class="space-y-3">
            <button onclick="updateBeds()" class="w-full bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold px-4 py-3.5 rounded-2xl text-xs uppercase tracking-wider transition-all text-left flex items-center gap-2">
              🛏️ Update Bed Capacity
            </button>
            <a href="/consultation" class="block w-full bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-4 py-3.5 rounded-2xl text-xs uppercase tracking-wider transition-all text-left flex items-center gap-2">
              👨‍⚕️ Manage Practitioner Directory
            </a>
          </div>
        </div>

        <!-- Hospital Info -->
        <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-6">
          <h3 class="font-bold text-slate-800 mb-4 font-display">Facility Profile</h3>
          <div class="space-y-3 text-sm" id="hospital-info">
            <div class="animate-pulse space-y-3">
              <div class="h-4 bg-slate-100 rounded-lg"></div>
              <div class="h-4 bg-slate-100 rounded-lg w-3/4"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- BED UPDATE MODAL -->
  <div id="bed-modal" class="hidden fixed inset-0 bg-black/45 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-3xl border border-slate-100 p-6 md:p-8 w-full max-w-sm shadow-2xl animate-slide-in">
      <h3 class="font-bold text-slate-800 mb-5 font-display text-lg">Update Bed Count</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-505 uppercase tracking-wider mb-1.5">Regular Beds Available</label>
          <input type="number" id="bed-available" min="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-505 uppercase tracking-wider mb-1.5">ICU Beds Available</label>
          <input type="number" id="bed-icu" min="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"/>
        </div>
        <div class="flex gap-3 pt-2">
          <button onclick="saveBeds()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition-all active:scale-[0.98] shadow-md shadow-blue-500/10">Save changes</button>
          <button onclick="document.getElementById('bed-modal').classList.add('hidden')" class="flex-1 bg-slate-100 hover:bg-slate-250 text-slate-700 font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition-all">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    let hospitalId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireAuth()) return;
      await loadDashboard();
      setInterval(loadDashboard, 30000);
    });

    async function loadDashboard() {
      try {
        const data = await apiGet('/hospital/dashboard');
        if (data.hospital) {
          hospitalId = data.hospital.id;
          document.getElementById('hospital-name').textContent = data.hospital.name;
          document.getElementById('stat-beds').textContent = data.hospital.available_beds;
          document.getElementById('hospital-info').innerHTML = `
            <div class="flex justify-between"><span class="text-gray-500">Available Beds</span><span class="font-bold">${data.hospital.available_beds}</span></div>
            <div class="flex justify-between"><span class="text-gray-500">ICU Beds</span><span class="font-bold">${data.hospital.icu_beds}</span></div>
            <div class="flex justify-between"><span class="text-gray-500">Rating</span><span class="font-bold">⭐ ${data.hospital.rating}</span></div>
          `;
        }
        if (data.stats) {
          document.getElementById('stat-emergencies').textContent = data.stats.active_emergencies;
          document.getElementById('stat-appointments').textContent = data.stats.today_appointments;
          document.getElementById('stat-doctors').textContent = data.stats.available_doctors;
        }
        renderEmergencies(data.active_emergencies || []);
      } catch (e) {
        console.error('Dashboard error:', e);
      }
    }

    function renderEmergencies(emergencies) {
      const el = document.getElementById('emergencies-list');
      if (!emergencies.length) {
        el.innerHTML = '<div class="text-center text-gray-400 py-8">No active emergencies</div>';
        return;
      }
      const severityColors = { critical: 'border-red-500 bg-red-50', high: 'border-orange-500 bg-orange-50', medium: 'border-yellow-500 bg-yellow-50', low: 'border-green-500 bg-green-50' };
      el.innerHTML = emergencies.map(em => `
        <div class="border-l-4 ${severityColors[em.severity] || 'border-gray-300 bg-gray-50'} rounded-r-xl p-4">
          <div class="flex items-start justify-between mb-3">
            <div>
              <span class="font-bold text-gray-800 capitalize">${em.emergency_type} Emergency</span>
              <span class="ml-2 px-2 py-0.5 bg-red-100 text-red-700 text-xs font-bold rounded-full uppercase">${em.severity}</span>
            </div>
            <div class="text-right">
              <p class="text-sm font-bold text-red-600">ETA: ${em.eta_minutes ? em.eta_minutes + ' min' : 'En route'}</p>
              <p class="text-xs text-gray-400">${new Date(em.created_at).toLocaleTimeString()}</p>
            </div>
          </div>
          ${em.patient ? `
          <div class="grid grid-cols-2 gap-2 text-sm mb-3">
            <div><p class="text-gray-500 text-xs">Patient</p><p class="font-bold">${em.patient.name}</p></div>
            <div><p class="text-gray-500 text-xs">Blood Group</p><p class="font-bold text-red-600">${em.patient.blood_group || '—'}</p></div>
            <div class="col-span-2"><p class="text-gray-500 text-xs">Medical History</p><p class="text-sm">${em.patient.medical_history || 'None'}</p></div>
            ${em.patient.allergies ? `<div class="col-span-2"><p class="text-gray-500 text-xs">Allergies</p><p class="text-sm text-red-600">${em.patient.allergies}</p></div>` : ''}
          </div>` : ''}
          ${em.ai_specialist ? `<div class="bg-blue-50 text-blue-700 px-3 py-2 rounded-lg text-sm"><strong>AI Recommendation:</strong> ${em.ai_specialist}</div>` : ''}
          <div class="flex gap-2 mt-3">
            <span class="px-2 py-1 rounded-full text-xs font-bold ${statusBadge(em.status)}">${em.status.replace('_', ' ').toUpperCase()}</span>
          </div>
        </div>
      `).join('');
    }

    function statusBadge(status) {
      const map = { requested: 'bg-yellow-100 text-yellow-700', ambulance_assigned: 'bg-blue-100 text-blue-700', en_route: 'bg-purple-100 text-purple-700', at_scene: 'bg-orange-100 text-orange-700', transporting: 'bg-red-100 text-red-700', arrived: 'bg-green-100 text-green-700' };
      return map[status] || 'bg-gray-100 text-gray-700';
    }

    function updateBeds() {
      document.getElementById('bed-modal').classList.remove('hidden');
    }

    async function saveBeds() {
      if (!hospitalId) return;
      const available = document.getElementById('bed-available').value;
      const icu = document.getElementById('bed-icu').value;
      try {
        await apiPatch(`/hospital/${hospitalId}/beds?available_beds=${available}&icu_beds=${icu}`, {});
        document.getElementById('bed-modal').classList.add('hidden');
        await loadDashboard();
      } catch (e) {
        alert('Failed: ' + e.message);
      }
    }
  </script>
</body>
</html>
